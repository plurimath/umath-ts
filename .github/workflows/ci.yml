name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --ignore-scripts
      - run: npm run check:artifacts
      - run: npm run build
      - run: npm test
      - uses: actions/checkout@v4
        with:
          repository: plurimath/plurimath-testsuite
          ref: 0d50db714d75e3883a507fbc47022eb547fb027f
          path: .corpus
      - run: npm run test:corpus -- .corpus --compatibility parslet --reporter deepest
      - run: npm pack --ignore-scripts
  # Unicode generation 5: the 72 generation-4 rows plus the 675 external
  # UnicodeMath rows, replayed raw-tree and typed-model through the packed
  # tarball installed into a clean consumer. Every row must match. The
  # rows come from the Ruby producer, which parses with the Parslet
  # compatibility policy and reports refusals with the Deepest reporter,
  # so the replay selects both explicitly; the package default stays Strict.
  unicode-generation-5:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run build
      - name: Pack and install the tarball into a clean consumer
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          mkdir consumer
          cd consumer
          echo '{"name":"consumer","private":true}' > package.json
          npm install --no-audit --no-fund ../plurimath-umath-ts-*.tgz
      - uses: actions/checkout@v4
        with:
          repository: plurimath/plurimath-testsuite
          ref: acbdf0319dfb9bc49c1726bdbdedac276476e9b5
          path: .corpus5
      - name: Replay generation 5 through the packed package
        env:
          UMATH_TS_DIST: ${{ runner.temp }}/consumer/node_modules/@plurimath/umath-ts/dist
        run: >
          npm run test:corpus -- .corpus5 --pin corpus-pin-5.json
          --compatibility parslet --reporter deepest
          --report "$RUNNER_TEMP/replay-5.json" --executed "$RUNNER_TEMP/executed-5.txt"
      - uses: ruby/setup-ruby@v1
        if: ${{ !cancelled() }}
        with:
          ruby-version: "3.4"
      - name: Check the executed IDs with the testsuite's validator
        if: ${{ !cancelled() }}
        run: |
          test -s "$RUNNER_TEMP/executed-5.txt"
          cd .corpus5
          ruby scripts/validate-unicode-external.rb --generation 5 --executed "$RUNNER_TEMP/executed-5.txt"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: unicode-generation-5-${{ matrix.os }}
          path: ${{ runner.temp }}/replay-5.json
          if-no-files-found: ignore
