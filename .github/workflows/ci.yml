name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --ignore-scripts
      - run: npm run check:artifacts
      - run: npm run build
      - run: npm test
      - uses: actions/checkout@v4
        with:
          repository: plurimath/plurimath-testsuite
          ref: 0d50db714d75e3883a507fbc47022eb547fb027f
          path: .corpus
      - run: npm run test:corpus:raw -- .corpus
      - run: npm pack --ignore-scripts
